name: CI

# Quality gates: tests, lint (warnings as errors), formatting, docs, MSRV, and a
# publishability check must pass on every push/PR to main. Scheduled jobs guard the
# golden-fixture invariant against the pinned Python reference stack and re-run the
# Kani proof harnesses. Pushing a `v*` tag re-runs every gate — proofs included —
# and then publishes the crate to crates.io.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Daily fixture-drift check (03:17 UTC): flags divergence between the committed
    # golden fixtures and a fresh regeneration from the pinned reference stack.
    - cron: "17 3 * * *"
  # Manual trigger, so the Kani job can be run on demand against a branch without
  # waiting for the nightly schedule or cutting a tag.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (manifest lint gate)
        # No blanket `-D warnings`: the manifest's `deny` groups (clippy::all,
        # clippy::cargo, plus curated restriction lints) still fail the build on
        # real defects, while the unstable `pedantic`/`nursery` groups stay at
        # `warn` so a new toolchain's added lints surface without breaking CI.
        run: cargo clippy --all-targets
      - name: Tests
        run: cargo test
      - name: Golden-fixture drift gate self-test
        # Stdlib-only fault injection, no reference stack needed. The drift gate
        # itself only runs on a schedule, so without this a change that stopped it
        # catching anything would sit unnoticed until the next cron.
        run: cd reference && python3 -m unittest gen.test_fixture_diff

  docs:
    name: docs (rustdoc, warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs (as docs.rs sees them)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: MSRV 1.93 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared MSRV
        run: cargo build

  publish-dryrun:
    name: cargo publish --dry-run (zero runtime deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Assert zero runtime dependencies
        run: |
          deps="$(cargo tree --edges no-dev | tail -n +2)"
          if [ -n "$deps" ]; then
            echo "unexpected runtime dependencies:"; echo "$deps"; exit 1
          fi
          echo "stats-claw has zero runtime dependencies"
      - name: Publish dry-run
        run: cargo publish --dry-run

  kani:
    name: Kani proof harnesses
    # Deliberately NOT on every push/PR: the full harness suite is a model-checking
    # run measured in tens of minutes, not the seconds the other gates take. It runs
    # nightly, on demand, and — because the proofs are part of what a release
    # claims — on every `v*` tag, where `publish` waits on it.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Kani
        # `cargo kani setup` fetches the CBMC bundle and the pinned nightly the
        # verifier builds harnesses with. Kani is a dev/CI tool only — it is never
        # a dependency of the crate, so the zero-runtime-dependency guarantee holds.
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Verify all proof harnesses
        # `-Z stubbing` is required: the `ln_choose` proof is modular and stubs
        # `ln_gamma`, which CBMC cannot model directly.
        run: cargo kani -Z stubbing

  # Regenerates every fixture into a scratch directory and compares it to the
  # committed tree *numerically*, not byte-wise. The committed JSON is never
  # touched, so the test suite keeps asserting against the exact recorded bits;
  # this job only answers whether the pinned reference stack still produces those
  # answers on a machine that is not the one that recorded them.
  #
  # It used to be `git diff --exit-code`, which demanded that IEEE-754 doubles be
  # bit-identical across CPUs, thread counts, and BLAS builds — and so failed
  # every run on 514 lines of last-bit rounding. See reference/gen/fixture_diff.py
  # for the tolerances and their justification, and docs/fixture-drift.md for the
  # measurements behind them.
  fixture-drift:
    name: golden-fixture drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned reference stack
        run: python3 -m pip install -r reference/requirements.txt
      - name: Record the resolved reference stack
        run: python3 -m pip freeze
      - name: Prove the drift gate still catches a real change
        run: cd reference && python3 -m unittest gen.test_fixture_diff
      - name: Regenerate into a scratch directory
        run: |
          rm -rf "$RUNNER_TEMP/fixture-drift" && mkdir -p "$RUNNER_TEMP/fixture-drift"
          cd reference && FIXTURE_GOLDEN_DIR="$RUNNER_TEMP/fixture-drift" python3 -m gen.run_all
      - name: Compare numerically
        run: cd reference && python3 -m gen.fixture_diff golden "$RUNNER_TEMP/fixture-drift"
      - name: Fail if the committed fixtures were edited
        # The regeneration writes outside the tree; nothing tracked may have moved.
        run: git diff --exit-code -- reference/golden

  publish:
    name: publish to crates.io
    # Only on a pushed `v*` tag, and only after every gate — including the Kani
    # proof suite, which also runs on tags — is green. The crates.io token is
    # supplied via the CRATE_API repository secret, passed through env (never
    # interpolated into a run: command).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gates, docs, msrv, publish-dryrun, kani]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify the tag matches the crate version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")"
          if [ "$GIT_TAG" != "v${crate_version}" ]; then
            echo "tag '$GIT_TAG' does not match Cargo.toml version 'v${crate_version}'"; exit 1
          fi
          echo "tag '$GIT_TAG' matches crate version"
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATE_API }}
        run: cargo publish
